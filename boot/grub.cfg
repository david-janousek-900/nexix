set nexix_console=vga
if [ "$nexix_console" = serial ]; then
    serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
    terminal_input serial
    terminal_output serial
else
    terminal_output console
fi
set gfxpayload=text
set timeout=0
set default=0
menuentry "Nexix" {
    multiboot2 /boot/nexix.elf console=$nexix_console
    boot
}
